name: Qualidade

on:
  pull_request:
  push:
    branches-ignore: [main]
  workflow_dispatch:

concurrency:
  group: qualidade-${{ github.ref }}
  cancel-in-progress: true

jobs:
  qualidade:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npx astro check
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - name: Sobe o build
        run: |
          npm run preview -- --port 4321 &
          npx --yes wait-on http://localhost:4321/ --timeout 60000
      - name: Acessibilidade (axe)
        run: npm run a11y
      - name: Lighthouse (celular)
        run: npm run lighthouse
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lighthouse
          path: shots/lighthouse.html
          if-no-files-found: ignore
